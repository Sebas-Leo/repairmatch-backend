spring.application.name=repairmatch-backend-test

spring.datasource.url=jdbc:h2:mem:repairmatch_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

security.jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
security.jwt.issuer=repairmatch-backend-test
security.jwt.expiration-seconds=3600

# Roles must be enum names, never numeric ordinals.
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true

security.jwt.refresh-expiration-seconds=604800
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
