spring.application.name=repairmatch-backend

security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=repairmatch-backend
security.jwt.expiration-seconds=3600

spring.datasource.url=jdbc:postgresql://localhost:5433/repairmatch
spring.datasource.username=repairmatch
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.open-in-view=false

# Roles must be enum names, never numeric ordinals.
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true
