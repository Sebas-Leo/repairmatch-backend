security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=repairmatch-backend
security.jwt.expiration-seconds=3600
security.jwt.refresh-expiration-seconds=${JWT_REFRESH_EXPIRATION_SECONDS:604800}

# Comma-separated explicit origins (no wildcard). Used by CorsConfig for /api/**.
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Roles/enums must be sent as names, never numeric ordinals.
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/repairmatch}
spring.datasource.username=${DB_USER:repairmatch}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
