$kind: http-request
name: "02 - Rechazar correo duplicado"
description: "Issue #3. Ejecutar la colección completa en orden."
url: "{{baseUrl}}/api/auth/register"
method: POST
body:
  type: json
  content: "{\n  \"name\": \"Ariana Demo\",\n  \"email\": \"{{clientEmail}}\",\n  \"password\": \"PruebaLocal123!\",\n  \"role\": \"CLIENT\"\n}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Estado 409\", () => pm.response.to.have.status(409));\npm.test(\"No expone contraseñas\", () => { const b = pm.response.json(); pm.expect(b).not.to.have.property(\"password\"); pm.expect(b).not.to.have.property(\"passwordHash\"); });\npm.test(\"Respuesta JSON\", () => pm.expect(pm.response.headers.get(\"Content-Type\")).to.include(\"json\"));"
    language: text/javascript
order: 2000
