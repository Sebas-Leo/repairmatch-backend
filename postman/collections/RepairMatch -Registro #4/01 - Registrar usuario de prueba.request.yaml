$kind: http-request
name: 01 - Registrar usuario de prueba
description: ""
url: "{{baseUrl}}/api/auth/register"
method: POST
body:
  type: json
  content: "{\r

    \  \"name\": \"Usuario Prueba\",\r

    \  \"email\": \"{{identityEmail}}\",\r

    \  \"password\": \"PruebaLocal2026!\",\r

    \  \"role\": \"CLIENT\"\r

    }"
scripts:
  - type: beforeRequest
    language: text/javascript
    code: pm.collectionVariables.set("identityEmail", "identity-" +
      pm.variables.replaceIn("{{$guid}}") + "@example.com");
  - type: afterResponse
    code: "pm.test(\"Crea el usuario sin exponer la contraseña\", function () {\r

      \    pm.response.to.have.status(201);\r

      \r

      \    const usuario = pm.response.json();\r

      \r

      \    pm.expect(usuario).to.have.all.keys(\r

      \        \"id\", \"name\", \"email\", \"role\"\r

      \    );\r

      \    pm.expect(usuario.id).to.be.a(\"string\").and.not.empty;\r

      });"
    language: text/javascript
order: 1789526995109
