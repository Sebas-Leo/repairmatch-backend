$kind: http-request
name: 03 - Consultar perfil autenticado
description: ""
url: "{{baseUrl}}/api/users/me"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Devuelve el perfil autenticado\", function () {\r

      \    pm.response.to.have.status(200);\r

      \r

      \    const perfil = pm.response.json();\r

      \r

      \    pm.expect(perfil).to.have.all.keys(\r

      \        \"id\", \"name\", \"email\", \"role\"\r

      \    );\r

      \    pm.expect(perfil.email).to.eql(pm.collectionVariables.get(\"identity\
      Email\"));\r

      \    pm.expect(perfil.role).to.eql(\"CLIENT\");\r

      });"
    language: text/javascript
order: 3908348936512192
