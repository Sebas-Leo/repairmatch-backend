$kind: http-request
name: "04 - Propietario consulta evidencias"
url: "{{baseUrl}}/api/requests/{{requestId}}/evidences"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{ownerToken}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: "pm.test(\"Estado 200\", () => pm.response.to.have.status(200));\npm.test(\"Evidencia propia\", () => { const b = pm.response.json(); pm.expect(b).to.have.lengthOf(1); pm.expect(b[0].mediaUrl).to.eql(\"https://example.com/private.jpg\"); });"
order: 4000
