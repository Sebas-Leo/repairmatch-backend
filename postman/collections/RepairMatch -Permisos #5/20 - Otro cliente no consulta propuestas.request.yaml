$kind: http-request
name: 20 - Otro cliente no consulta propuestas
url: "{{baseUrl}}/api/requests/{{requestId}}/proposals"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{otherToken}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |
      pm.test("Estado 403", () => pm.response.to.have.status(403));
order: 20000
