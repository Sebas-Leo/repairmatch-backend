$kind: http-request
name: 17 - Propietario consulta solicitud
url: "{{baseUrl}}/api/requests/{{requestId}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{ownerToken}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Estado 200", () => pm.response.to.have.status(200));
      pm.test("Solicitud propia", () => pm.expect(String(pm.response.json().id)).to.eql(String(pm.collectionVariables.get("requestId"))));
order: 17000
