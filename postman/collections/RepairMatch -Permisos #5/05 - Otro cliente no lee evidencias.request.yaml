$kind: http-request
name: "05 - Otro cliente no lee evidencias"
url: "{{baseUrl}}/api/requests/{{requestId}}/evidences"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{otherToken}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: "pm.test(\"Estado 403\", () => pm.response.to.have.status(403));\npm.test(\"No revela evidencia privada\", () => pm.expect(pm.response.text()).not.to.include(\"private.jpg\"));"
order: 5000
