$kind: http-request
name: "10 - Otro cliente no cancela solicitud"
url: "{{baseUrl}}/api/requests/{{requestId}}/cancel"
method: PATCH
auth:
  type: bearer
  credentials:
    token: "{{otherToken}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: "pm.test(\"Estado 403\", () => pm.response.to.have.status(403));"
order: 10000
