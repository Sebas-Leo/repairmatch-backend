$kind: http-request
name: "09 - Propietario adjunta evidencia"
url: "{{baseUrl}}/api/requests/{{requestId}}/evidences"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{ownerToken}}"
body:
  type: json
  content: "{\"mediaUrl\":\"https://example.com/new.jpg\",\"mediaType\":\"image/jpeg\"}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: "pm.test(\"Estado 201\", () => pm.response.to.have.status(201));\npm.test(\"El intento ajeno no creó evidencia\", () => pm.expect(pm.response.json().evidenceNumber).to.eql(2));"
order: 9000
