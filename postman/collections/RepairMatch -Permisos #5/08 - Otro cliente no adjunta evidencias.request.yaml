$kind: http-request
name: "08 - Otro cliente no adjunta evidencias"
url: "{{baseUrl}}/api/requests/{{requestId}}/evidences"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{otherToken}}"
body:
  type: json
  content: "{\"mediaUrl\":\"https://example.com/new.jpg\",\"mediaType\":\"image/jpeg\"}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: "pm.test(\"Estado 403\", () => pm.response.to.have.status(403));"
order: 8000
