$kind: http-request
name: 19 - Propietario consulta propuestas
url: "{{baseUrl}}/api/requests/{{requestId}}/proposals"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{ownerToken}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: >-
      pm.test("Estado 200", () => pm.response.to.have.status(200));

      pm.test("Lista de propuestas", () =>
      pm.expect(pm.response.json()).to.be.an("array"));
order: 19000
