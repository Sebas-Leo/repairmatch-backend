services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: repairmatch
      POSTGRES_USER: repairmatch
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Debes configurar DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repairmatch -d repairmatch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: