services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: repairmatch
      POSTGRES_USER: repairmatch
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Debes configurar DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repairmatch -d repairmatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: eclipse-temurin:21-jre
    working_dir: /app
    command: ["java", "-jar", "/app/app.jar"]
    volumes:
      - ./target/repairmatch-backend-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/repairmatch
      DB_USER: repairmatch
      DB_PASSWORD: ${DB_PASSWORD:?Debes configurar DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Debes configurar JWT_SECRET}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
