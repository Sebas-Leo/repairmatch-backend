name: Comprobaciones de PR
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  contribution-contract:
    name: Contribution contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = (pr.body || '').replace(/<!--[\s\S]*?-->/g, '');
            const errors = [];
            if (!/^(feat|fix|docs|test|refactor|chore|ci|build|perf|revert)(\([a-z0-9-]+\))?!?: .+/.test(pr.title))
              errors.push('Usa un título convencional, por ejemplo feat(proposals): aceptar una propuesta.');
            const numbers = [...new Set([...body.matchAll(/^\s*(?:Closes|Refs) #(\d+)\s*$/gmi)].map(m => Number(m[1])))];
            if (!numbers.length) errors.push('Agrega una línea exacta Closes #123 o Refs #123 de este repositorio.');
            for (const issue_number of numbers) {
              try {
                const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number });
                if (issue.pull_request || !issue.labels.some(l => l.name === 'status:approved'))
                  errors.push(`#${issue_number} debe ser una tarea con status:approved asignado por un responsable de mantenimiento.`);
              } catch { errors.push(`No se pudo verificar la tarea #${issue_number} en este repositorio.`); }
            }
            const verification = (body.match(/^## (?:Verification|Verificación)\s*\n([\s\S]*?)(?=^## |$(?![\s\S]))/m) || [])[1] || '';
            if (!verification.trim() || /^(todo|tbd|n\/a|none|pending|pendiente|ninguna|por completar|no aplica)[.!]?$/i.test(verification.trim()))
              errors.push('Completa ## Verificación (o ## Verification) con comprobaciones, resultados reales y evidencia, no texto de relleno.');
            if (errors.length) core.setFailed(errors.join('\n'));
            else core.info('Metadatos de contribución verificados. Esto no verifica el comportamiento del backend ni la aprobación de otro integrante.');
  workflow-tests:
    name: Workflow tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: node --test tests/workflows.test.cjs
