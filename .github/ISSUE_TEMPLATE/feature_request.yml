name: Tarea de backend
description: Propón un entregable de backend o una corrección que se pueda revisar por separado.
title: "feat(module): "
labels: [delivery, "status:needs-review"]
body:
  - type: checkboxes
    attributes:
      label: Comprobaciones previas
      options:
        - label: Busqué tareas existentes para evitar duplicados.
          required: true
        - label: Esperaré la aprobación del responsable de mantenimiento antes de abrir una PR.
          required: true
  - type: textarea
    attributes:
      label: Problema
      description: Explica la necesidad o el error e incluye pasos para reproducirlo cuando corresponda.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Solución propuesta
      description: Define un entregable pequeño, sus dependencias y lo que queda fuera del alcance.
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Módulo
      description: El responsable de mantenimiento también debe aplicar la etiqueta module correspondiente y asignar al colaborador.
      options: [Identidad (identity), Solicitudes (requests), Emparejamiento (matching), Propuestas (proposals), Servicios (services), Compartido (shared)]
    validations:
      required: true
  - type: textarea
    attributes:
      label: Criterios de aceptación
      description: Usa casillas Markdown para resultados observables, incluidos casos inválidos o no autorizados.
      placeholder: "- [ ] Describe un resultado observable."
    validations:
      required: true
  - type: textarea
    attributes:
      label: Evidencia
      description: Agrega resultados de pruebas, ejecuciones Postman sin datos sensibles o PR vinculadas durante el trabajo. Nunca incluyas credenciales.
