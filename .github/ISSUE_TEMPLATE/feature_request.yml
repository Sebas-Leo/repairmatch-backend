name: Backend task
description: Propose one reviewable backend deliverable or bug fix.
title: "feat(module): "
labels: [delivery, "status:needs-review"]
body:
  - type: checkboxes
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I will wait for maintainer approval before opening a PR.
          required: true
  - type: textarea
    attributes:
      label: Problem
      description: Explain the need or the bug, including reproduction steps when relevant.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
      description: Define a small deliverable, dependencies, and what stays out of scope.
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Module
      description: A maintainer must also apply the matching module label and assignee.
      options: [identity, requests, matching, proposals, services, shared]
    validations:
      required: true
  - type: textarea
    attributes:
      label: Acceptance criteria
      description: Use Markdown checkboxes for observable outcomes, including invalid/unauthorized cases.
      placeholder: "- [ ] Describe an observable result."
    validations:
      required: true
  - type: textarea
    attributes:
      label: Evidence
      description: Add test results, sanitized Postman runs, or linked PRs as work progresses. Never include credentials.
